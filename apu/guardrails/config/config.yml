# Shared NeMo Guardrails configuration for every class.
#
# The classifier runs on Gemini through its OpenAI-compatible endpoint: `engine: openai`
# selects the OpenAI-compatible client, `parameters.base_url` points it at Gemini, and the
# key is read from GEMINI_API_KEY, never written here.
#
# gemini-3.5-flash-lite was chosen by measurement, not by size: it holds all 69 attacks of
# the red team corpus, twice, at 0.66 s, where the larger gemini-3.8-flash takes 1.26 s and
# misses two. The full comparison is in docs/models.md.
#
# This must match config.GUARD_MODEL, which the interface and the tests read.
models:
  - type: main
    engine: openai
    model: gemini-3.5-flash-lite
    api_key_env_var: GEMINI_API_KEY
    parameters:
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/

rails:
  input:
    flows:
      - school topic check
