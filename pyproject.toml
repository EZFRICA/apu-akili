[project]
name = "apu-akili"
version = "0.1.0"
description = "A school tutor built on the Agent Processor Unit: tiered persistent memory, a topical guard on every exchange, and text, voice and braille channels"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    # Model calls. Every text role goes through one OpenAI-compatible client per provider
    # (apu/inference/llm.py), so moving a role to another provider is a setting.
    "openai>=1.0.0",
    "google-genai>=2.24.0",
    # Speech in and out (apu/modality/voice.py, apu/ui/live/).
    "elevenlabs>=2.68.0",
    # Agent runtime (apu/runtime/agent.py). langchain-core is imported directly for the
    # message types, so it is listed rather than relied on as a transitive.
    "langgraph",
    "langchain-core",
    "python-dotenv",
    # Topical guard (apu/guardrails/).
    "nemoguardrails>=0.24.1",
    # Web search, only for turns the guard has validated (apu/tools/web_search.py).
    "langchain-tavily>=0.2.18",
    # Local embeddings: ONNX via fastembed. Deliberately not sentence-transformers or torch,
    # both too heavy for the target hardware. Pinned to the tested minor.
    "fastembed>=0.8.0,<0.9",
    # L3 vector store. Pinned to the tested minor: list_tables() changed its return type
    # within the 0.30 line, and an unattended upgrade across that boundary silently
    # disabled the whole L3 tier.
    "lancedb>=0.30.2,<0.31",
    # Course packages are Parquet. pyarrow is never imported, but pandas needs it to read
    # and write that format, so it is a runtime dependency all the same.
    "pandas",
    "pyarrow",
    # Escalation clustering (apu/escalation/).
    "scikit-learn>=1.9.1",
    # Cloud course registry: cloud_registry/ publishes, apu/sync/ downloads. Both sides
    # go through an authenticated GCS client; httpx fetches the public manifest, pyyaml
    # reads curriculum.yaml.
    "google-cloud-storage>=3.4.1",
    "google-auth>=2.49.2",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    # Interfaces. Streamlit for the pupil, the teacher and the demo (apu/ui/app.py);
    # watchdog is what it reloads with, and without it Streamlit falls back to polling and
    # warns at every launch. FastAPI and uvicorn for the live voice lab and the keynote
    # stage it serves (apu/ui/live/).
    "streamlit>=1.55.0",
    "watchdog>=6.0.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    # The linter CI runs. Pinned to a minor: a new rule landing upstream should be a
    # deliberate upgrade, not a red build on an unrelated pull request.
    "ruff>=0.14.0,<0.15",
]

[tool.uv]
# An application, not a library: `uv sync` installs the dependencies without building
# and installing apu itself; commands run from the repo root import it.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
